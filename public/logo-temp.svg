<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo circular azul -->
  <circle cx="256" cy="256" r="240" fill="#3b82f6"/>
  
  <!-- Marco blanco -->
  <circle cx="256" cy="256" r="220" fill="white"/>
  
  <!-- Texto DMC -->
  <text x="256" y="200" font-family="Arial, sans-serif" font-size="80" 
        font-weight="bold" fill="#1e40af" text-anchor="middle">DMC</text>
  
  <!-- Texto Checklist -->
